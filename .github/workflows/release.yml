name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true
      - name: Test
        run: cd admin && go vet ./... && go test -count=1 ./...
      - name: govulncheck (release gate)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          (cd admin && govulncheck ./...)
          (cd backend && govulncheck ./...)
      - name: Build binaries + SHA256SUMS
        run: scripts/build-release.sh "${GITHUB_REF_NAME}" amd64 arm64 arm
      - name: Scan the built binaries
        run: for f in dist/transfersh-linux-amd64 dist/transfercli-admin-linux-amd64; do govulncheck -mode=binary "$f"; done
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SHA256SUMS
            dist/transfercli-admin-linux-*
            dist/transfersh-linux-*
            dist/transfercli-web.tar.gz
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).

            Install: `curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install.sh -o install.sh && sudo bash install.sh`
